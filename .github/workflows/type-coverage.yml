name: Type Coverage
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: type-coverage-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  type-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Measure type coverage (PR and base)
        id: measure
        env:
          # Keep type-coverage output free of ANSI so grep can parse it.
          NO_COLOR: "1"
          FORCE_COLOR: "0"
        run: |
          set -euo pipefail

          install_deps() {
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi
          }

          # Emit "covered total pct" (no parentheses, no "%") so GITHUB_OUTPUT
          # and downstream parse stay reliable across runner versions.
          measure() {
            local raw line covered total pct
            raw="$(npx --yes type-coverage@2 --strict 2>&1 || true)"
            line="$(printf '%s\n' "$raw" | grep -oE '\([0-9]+ / [0-9]+\) [0-9.]+%' | tail -1 || true)"
            if [ -z "$line" ]; then
              echo "type-coverage measure failed; raw output:" >&2
              printf '%s\n' "$raw" >&2
              echo "unknown"
              return 0
            fi
            covered="$(printf '%s\n' "$line" | grep -oE '[0-9]+' | sed -n '1p')"
            total="$(printf '%s\n' "$line" | grep -oE '[0-9]+' | sed -n '2p')"
            pct="$(printf '%s\n' "$line" | grep -oE '[0-9]+\.[0-9]+|[0-9]+%' | head -1 | tr -d '%')"
            echo "${covered} ${total} ${pct}"
          }

          install_deps
          PR_METRICS="$(measure)"
          git checkout -q "${{ github.event.pull_request.base.sha }}"
          install_deps
          BASE_METRICS="$(measure)"

          {
            echo "pr_metrics<<EOF"
            echo "${PR_METRICS}"
            echo "EOF"
            echo "base_metrics<<EOF"
            echo "${BASE_METRICS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "PR metrics:   ${PR_METRICS}"
          echo "Base metrics: ${BASE_METRICS}"
      - uses: actions/github-script@v7
        with:
          script: |
            const parse = (s) => {
              const text = (s || "").trim();
              // Preferred: "covered total pct"
              let m = text.match(/^([0-9]+)\s+([0-9]+)\s+([0-9.]+)$/);
              if (m) {
                const covered = +m[1], total = +m[2], pct = +m[3];
                return { covered, total, untyped: total - covered, pct };
              }
              // Legacy: "(covered / total) pct%"
              m = text.match(/\(([0-9]+) \/ ([0-9]+)\) ([0-9.]+)%?/);
              if (!m) return null;
              const covered = +m[1], total = +m[2], pct = +m[3];
              return { covered, total, untyped: total - covered, pct };
            };
            const pr = parse(${{ toJSON(steps.measure.outputs.pr_metrics) }});
            const base = parse(${{ toJSON(steps.measure.outputs.base_metrics) }});
            const cell = (b, p, fmt) => {
              const bs = b == null ? "—" : fmt(b);
              const ps = p == null ? "—" : fmt(p);
              const d = (b != null && p != null) ? (p - b) : null;
              const ds = d == null ? "—" : (d >= 0 ? "+" : "") + (Number.isInteger(d) ? d : d.toFixed(2));
              return `| ${bs} | ${ps} | ${ds} |`;
            };
            const rows = [
              `| Type coverage ${cell(base && base.pct, pr && pr.pct, (v) => v.toFixed(2) + "%")}`,
              `| Typed symbols ${cell(base && base.covered, pr && pr.covered, (v) => v)}`,
              `| Untyped symbols ${cell(base && base.untyped, pr && pr.untyped, (v) => v)}`,
            ].join("\n");
            const note = (!pr || !base)
              ? "\n\n> Measurement incomplete on one or both sides; see the workflow log for raw `type-coverage` output."
              : "";
            const body = `## Type Coverage\n\n| Metric | Base | PR | Delta |\n|---|---|---|---|\n${rows}\n${note}\n\n<sub>via \`type-coverage --strict\` · Project Steward</sub>\n<!-- steward-type-coverage -->`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const existing = comments.find((c) => c.body && c.body.includes("<!-- steward-type-coverage -->"));
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
